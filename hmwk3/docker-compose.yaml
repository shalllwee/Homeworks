services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: photo_db
    ports:
      - "5432:5432"
    volumes:
      - ./sql/dbinit.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: photo-server
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - POSTGRES_DSN=postgres://postgres:password@postgres:5432/photo_db?sslmode=disable
      - REDIS_ADDR=redis:6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      - postgres
      - redis
      - rabbitmq

  processor:
    build:
      context: .
      dockerfile: processor/Dockerfile
    container_name: photo-processor
    ports:
      - "9100:9100"
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - SERVER_URL=http://server:8000
    depends_on:
      - rabbitmq
      - server

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - processor

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

volumes:
  pgdata: